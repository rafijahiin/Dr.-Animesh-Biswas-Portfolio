# Sveltia CMS configuration
# This defines the admin panel Dr. Biswas sees at /admin

backend:
  name: git-gateway
  branch: main

# Where uploaded images get stored in the repo
media_folder: "public/uploads"
public_folder: "/uploads"

# Logo shown in the admin panel
logo_url: /assets/favicon.svg

site_url: https://animesh-biswas.netlify.app
display_url: https://animesh-biswas.netlify.app

collections:
  # ───────── FIELD NOTES (blog) ─────────
  - name: posts
    label: "Field Notes (Blog)"
    label_singular: "Field Note"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Drafts"
        field: draft
        pattern: true
      - label: "Published"
        field: draft
        pattern: false
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Published date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: category, label: "Category badge", widget: select, options: ["Maternal Health", "SRH Policy", "MPDSR", "Commentary", "Field Notes", "Research", "Personal"], default: "Field Notes" }
      - { name: cover, label: "Cover image", widget: image, required: false, hint: "Recommended 1600x1000 (16:10). Optional — placeholder shows if empty." }
      - { name: summary, label: "Summary / excerpt", widget: text, hint: "1-3 sentences shown on the homepage card." }
      - { name: featured, label: "Featured (large card on homepage)", widget: boolean, default: false, required: false }
      - { name: draft, label: "Draft (don't publish yet)", widget: boolean, default: true, required: false }
      - { name: tags, label: "Tags", widget: list, required: false, default: [] }
      - { name: body, label: "Body", widget: markdown }

  # ───────── GALLERY ─────────
  - name: gallery
    label: "Photo Gallery"
    label_singular: "Photo"
    folder: "src/content/gallery"
    create: true
    slug: "{{category}}-{{slug}}"
    summary: "{{category}} — {{caption}}"
    sortable_fields: ["order", "date", "category"]
    view_groups:
      - label: "By category"
        field: category
    fields:
      - { name: image, label: "Photo", widget: image }
      - name: category
        label: "Category"
        widget: select
        options:
          - { label: "Field", value: "field" }
          - { label: "Conferences", value: "conferences" }
          - { label: "Community", value: "community" }
          - { label: "Personal", value: "personal" }
      - { name: caption, label: "Caption", widget: string, hint: "Short — e.g. 'Cox's Bazar field visit'" }
      - { name: location, label: "Location", widget: string, required: false, hint: "e.g. 'Cox's Bazar, Bangladesh'" }
      - { name: date, label: "Date taken", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: order, label: "Display order (lower = first)", widget: number, default: 100, value_type: int, required: false }
      - { name: featured, label: "Featured (larger tile)", widget: boolean, default: false, required: false }

  # ───────── PUBLICATIONS (featured 5-8) ─────────
  - name: publications
    label: "Featured Publications"
    label_singular: "Publication"
    folder: "src/content/publications"
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{year}} — {{title}}"
    sortable_fields: ["year", "title"]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: year, label: "Year", widget: number, value_type: int, min: 2000, max: 2030 }
      - { name: venue_name, label: "Venue (short)", widget: string, hint: "e.g. 'WHO', 'UNFPA', 'Journal'" }
      - { name: venue_sub, label: "Venue subtitle", widget: string, hint: "e.g. 'Global report', 'Peer-reviewed'" }
      - { name: abstract, label: "Abstract / blurb", widget: text }
      - { name: tags, label: "Tags", widget: list, default: [] }
      - { name: url, label: "Link to paper (optional)", widget: string, required: false }
      - { name: order, label: "Display order (lower = first)", widget: number, default: 100, value_type: int, required: false }

  # ───────── SINGLE-FILE DATA (stats, site, videos) ─────────
  - name: settings
    label: "Site Settings"
    delete: false
    editor: { preview: false }
    files:
      - name: stats
        label: "Numbers (Chapter 03)"
        file: "src/data/stats.json"
        fields:
          - { name: publications, label: "Publications count", widget: number, value_type: int, default: 130 }
          - { name: publications_suffix, label: "Publications suffix", widget: string, default: "+" }
          - { name: years, label: "Years of practice", widget: number, value_type: int, default: 12 }
          - { name: years_suffix, label: "Years suffix", widget: string, default: "+" }
          - { name: countries, label: "Countries with programme reach", widget: number, value_type: int, default: 15 }
          - { name: countries_suffix, label: "Countries suffix", widget: string, default: "+" }
          - { name: advisory_years, label: "Years on WHO advisory", widget: number, value_type: int, default: 5 }
          - { name: advisory_suffix, label: "Advisory suffix", widget: string, default: "+" }

      - name: site
        label: "General Site Info"
        file: "src/data/site.json"
        fields:
          - { name: title, label: "Site title", widget: string, default: "Dr. Animesh Biswas — Global Health, in the Field" }
          - { name: description, label: "Meta description", widget: text }
          - { name: email, label: "Contact email", widget: string, default: "hello@animeshbiswas.com" }
          - { name: linkedin, label: "LinkedIn URL", widget: string }
          - { name: researchgate, label: "ResearchGate URL", widget: string, required: false }
          - { name: unfpa, label: "UNFPA profile URL", widget: string, required: false }
          - { name: bibliography_pdf, label: "Bibliography PDF (uploaded)", widget: file, required: false, hint: "If set, 'Request bibliography' becomes a download link." }

      - name: videos
        label: "YouTube Section (Diaries)"
        file: "src/data/videos.json"
        fields:
          - { name: channel_handle, label: "YouTube channel handle", widget: string, default: "@AniTapDoctorCouple" }
          - { name: channel_id, label: "YouTube channel ID (UC...)", widget: string, hint: "Find at: youtube.com/account_advanced" }
          - { name: section_title, label: "Section title", widget: string, default: "Diaries" }
          - { name: section_subtitle, label: "Section subtitle", widget: string, default: "From the AniTap channel — the doctor couple, off-duty." }
          - { name: pinned_url, label: "Pinned video URL (optional)", widget: string, required: false, hint: "If set, this video shows first instead of the latest." }
          - { name: show_section, label: "Show this section on homepage", widget: boolean, default: true }
